name = "LogN7"
defaultTargets = ["LogN7"]

# Mathlib is the only dependency (same revision as the Coulomb formalisation); lake-manifest.json
# records the resolved revisions of its own dependencies.
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# Challenge statement, main theorems and axiom check.
[[lean_lib]]
name = "LogN7"
roots = ["LogN7.Challenge", "LogN7.Solution", "LogN7.Check.Axioms"]
globs = ["LogN7.+"]

# Minorants of the log kernel, the quartic local lemma L′ and the hand-off to the global argument.
[[lean_lib]]
name = "LogLean"
globs = ["LogLean.+"]

# Support library: five files in this directory plus modules regenerated from the upstream
# Coulomb formalisation by ./regen.sh.
[[lean_lib]]
name = "ThomsonGen"
globs = ["ThomsonGen.+"]
