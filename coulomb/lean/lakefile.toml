name = "CoulombN7"
defaultTargets = ["CoulN7"]

# Mathlib is the only dependency (same revision as the Coulomb formalisation).
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# N = 7 Coulomb (s = 1): certificate chain of numerics/n7_interval, main theorems, axiom check, Comparator challenge
# and solution.
[[lean_lib]]
name = "CoulN7"
roots = ["CoulN7.Main", "CoulN7.Check.Axioms", "CoulN7.Challenge", "CoulN7.Solution"]
globs = ["CoulN7.+"]

# The polynomial/Möbius calculus of the log formalisation (LogLean/MinorCore.lean only).
[[lean_lib]]
name = "LogLean"
globs = ["LogLean.+"]

# Support library: stored generic modules plus modules regenerated from the upstream Coulomb formalisation.
[[lean_lib]]
name = "ThomsonGen"
globs = ["ThomsonGen.+"]
