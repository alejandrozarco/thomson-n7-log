fidelity:
  divergences: >-
    - The Lean version of the quartic local lemma (LocalMain.Lprime) has the constants 0.0268 and 0.0200. They are
      weaker than the Python-certified 0.0342 and 0.0227, and both suffice.
    - The cap uses a re-rounded certificate (certificates/cert_cap_log_D12_short.json) with the same bound.
    - In the statement, SphereConfig requires injectivity (distinct points), because Lean has log 0 = 0. The
      statement definitions are upstream's, imported from the regenerated ThomsonGen/Preamble.lean.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (read-only reviewer instances)"
    - "Claude Fable 5.1"
    - "gpt-6-astra (OpenAI)"
  notes: >-
    No human expert has checked the proof. The conjecture is not regarded as settled by this warrant (README).
    Comments and checks are welcome via GitHub issues.

alignment:
  namespace: "ThomsonN7Log"
  statements:
    - source: "Armentano et al., Conjecture 1 (log energy, N = 7): minimality"
      lean: "ThomsonN7Log.thomson_seven_log"
      module: "lean/LogN7/Solution.lean (statement: lean/LogN7/Challenge.lean)"
      status: "proved"
    - source: "Armentano et al., Conjecture 1 (log energy, N = 7): uniqueness up to O(3) and relabelling"
      lean: "ThomsonN7Log.thomson_seven_log_unique"
      module: "lean/LogN7/Solution.lean (statement: lean/LogN7/Challenge.lean)"
      status: "proved"
    - source: "Quartic local lemma L' (local/LOCAL_LEMMA.md, section 3')"
      lean: "LocalMain.Lprime"
      module: "lean/LogLean/LocalMain.lean"
      status: "proved"
      note: "Weaker constants than the Python version; see fidelity."

acknowledgements: >-
  Built on huwngtran/thomson-n7-lean (Coulomb N = 7). Uses Mathlib, Lean 4, and Python numerical libraries.
