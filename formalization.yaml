automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Several coordinated Claude Opus 5.5 sessions and sub-agents with terminal access. Python
        (mpmath, python-flint, sympy, cvxpy/Clarabel) was used for SDP solving, exact rounding and checkers.
        Lean 4 v4.34.1 + Mathlib, with every module built one at a time (nice 19) on a Linux workstation.
      cost:
        wall_time: "about 5 days (2026-09-27 to 2026-10-01)"
        spend_usd: "subscription-based usage"
        hardware: "Apple-silicon laptop; Linux workstation (6 cores, 19 GB RAM) for Lean builds"
      prompting_notes: >-
        The owner set goals and decided on scope, publication, wording and the handling of upstream code. The agents
        planned and executed. Plans and results are recorded in a development journal (not public).
    - method: "agent"
      models: ["claude-opus-5-5", "claude-fable-5-1", "gpt-6-astra"]
      framework: "Claude Code; OpenAI Codex CLI (gpt-6-astra)"
      tool_setup: "Separate read-only reviewer instances, one review per stage."
      prompting_notes: >-
        Adversarial reviews covered the certificates, the local lemma, the list of deductions, the Lean proof
        (statement fidelity, trust surface, assembly) and the publication package. The maintainers report that the
        findings were addressed (review reports not public); see AI_DISCLOSURE.md.
  spend_usd: "subscription-based usage (not separately metered)"
  notes: "See AI_DISCLOSURE.md."

fidelity:
  divergences: >-
    - The Lean version of the quartic local lemma (LocalMain.Lprime) has the constants 0.0268 and 0.0200. They are
      weaker than the Python-certified 0.0342 and 0.0227, and both suffice.
    - The cap uses a re-rounded certificate (certificates/cert_cap_log_D12_short.json) with the same bound.
    - In the statement, SphereConfig requires injectivity (distinct points), because Lean has log 0 = 0. The
      statement definitions are upstream's, imported from the regenerated ThomsonGen/Preamble.lean.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (read-only reviewer instances)"
    - "Claude Fable 5.1"
    - "gpt-6-astra (OpenAI)"
  notes: >-
    No human expert has checked the proof. The conjecture is not regarded as settled by this warrant (README).
    Comments and checks are welcome via GitHub issues.

alignment:
  namespace: "ThomsonN7Log"
  statements:
    - source: "Armentano et al., Conjecture 1 (log energy, N = 7): minimality"
      lean: "ThomsonN7Log.thomson_seven_log"
      module: "lean/LogN7/Solution.lean (statement: lean/LogN7/Challenge.lean)"
      status: "proved"
    - source: "Armentano et al., Conjecture 1 (log energy, N = 7): uniqueness up to O(3) and relabelling"
      lean: "ThomsonN7Log.thomson_seven_log_unique"
      module: "lean/LogN7/Solution.lean (statement: lean/LogN7/Challenge.lean)"
      status: "proved"
    - source: "Quartic local lemma L' (local/LOCAL_LEMMA.md, section 3')"
      lean: "LocalMain.Lprime"
      module: "lean/LogLean/LocalMain.lean"
      status: "proved"
      note: "Weaker constants than the Python version; see fidelity."

acknowledgements: >-
  Built on the Lean formalisation of the Coulomb case N = 7 by Hung Tran (huwngtran/thomson-n7-lean), which follows
  the N = 8 method of Kryvonos, Liehr and Taylor and the Lean development of Tooby-Smith and Zughaid. Uses Mathlib, Lean 4, and Python numerical libraries.
