# formalization.yaml (v0.4): repo-root metadata for formalization projects.

version: "v0.4"

project:
  name: "thomson-n7-log: logarithmic and Riesz s = 2 energy of seven points on the sphere"
  description: >-
    An AI-produced warrant, meaning a machine-checked Lean proof that no human has digested. It concerns the
    statement that the regular pentagonal bipyramid minimises the logarithmic energy sum_{i<j} -log|x_i - x_j| of
    seven pairwise distinct points on the unit sphere S^2, uniquely up to an orthogonal map and a relabelling
    (Conjecture 1 of Armentano et al.). The same is stated and checked for the Riesz s = 2 energy
    sum_{i<j} |x_i - x_j|^{-2}.
    The argument follows the Lean formalisation of the Coulomb case (huwngtran/thomson-n7-lean):
    - a case split by the most nearly antipodal pair (Case 1, five slabs, a cap);
    - exact three-point (Bachoc-Vallentin type) semidefinite certificates, checked by `decide +kernel`;
    - polynomial minorants of the kernel;
    - on the cap: coercivity, ring rigidity and, for the logarithmic energy, a quartic local lemma. The local lemma
      is needed because the Hessian at the bipyramid has a flat two-dimensional ring direction at s = 0 and s = 2.
    The repository also contains the certificates as JSON with independent exact checkers in Python.
  authors:
    - "alejandrozarco (repository owner; directed the work)"
    - "Claude Opus 5.5 (Anthropic), AI model that produced the mathematics, certificates and Lean code"
  responsible_maintainers:
    - "alejandrozarco"
  license: "Apache-2.0 (LICENSE); not covering the regenerated upstream code or the upstream material in adapted declarations (README, Licence)"

sources:
  - title: "Characterization of Logarithmic Fekete Critical Configurations of at Most Six Points in All Dimensions"
    authors: ["Diego Armentano", "Leandro Bentancur", "Federico Carrasco", "Marcelo Fiori", "Matías Valdés", "Mauricio Velasco"]
    id: "arXiv:2502.10152"
    doi: "10.1016/j.jsc.2026.102570"
    venue: "J. Symbolic Comput. 137 (2026), 102570"
    type: "article"
    location: "Conjecture 1 (seven points on S^2: the pentagonal bipyramid is the unique log-energy minimiser)"
    relationship: "other"
    note: "Source of the conjecture that the main theorem states. Its proof is not taken from this paper."
    author_endorsement: "not-contacted"
  - title: "Case split, certificates and quartic local lemma for N = 7 (log and Riesz s = 2)"
    type: "original-proof"
    relationship: "formalizes"
    note: >-
      The argument was presented in this repository (METHOD.md, local/LOCAL_LEMMA.md, lean/OVERVIEW.md). It is
      AI-produced and has not been refereed.
    author_endorsement: "n/a"
  - title: "Energy minimization for eight points on the sphere"
    authors: ["Liudmyla Kryvonos", "Lukas Liehr", "Mitchell A. Taylor"]
    id: "arXiv:2609.22077"
    type: "article"
    relationship: "adapts"
    note: >-
      Source of the method (three-point bounds, case split, certificates), via the N = 7 Coulomb formalisation
      huwngtran/thomson-n7-lean. Also treats the logarithmic and all Riesz s >= 0 energies for eight points.
    author_endorsement: "not-contacted"
  - title: "New upper bounds for kissing numbers from semidefinite programming"
    authors: ["C. Bachoc", "F. Vallentin"]
    id: "J. Amer. Math. Soc. 21 (2008), 909-924"
    type: "article"
    relationship: "background"
    note: "Three-point positivity on S^2. The Lean version is upstream's (huwngtran/thomson-n7-lean, `bv_positivity`)."
    author_endorsement: "n/a"

